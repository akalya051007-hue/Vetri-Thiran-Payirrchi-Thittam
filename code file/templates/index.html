<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FitBuddy - AI Fitness Planner
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>


<main class="page">


    <section class="hero">

        <div class="badge">
            FITBUDDY • GEMINI AI
        </div>


        <h1>
            Your 7-Day Fitness Plan,
            Personalized.
        </h1>


        <p>
            Enter your details and FitBuddy
            will create a personalized
            AI-powered fitness plan.
        </p>

    </section>


    {% if error %}

    <div class="alert error">

        {{ error }}

    </div>

    {% endif %}


    <section class="card">


        <h2>
            Create Your Fitness Plan
        </h2>


        <form
            method="post"
            action="/generate-workout"
        >


            <div class="grid">


                <label>

                    Name

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your name"
                        required
                    >

                </label>


                <label>

                    User ID

                    <input
                        type="text"
                        name="user_id"
                        placeholder="Example: FB001"
                        required
                    >

                </label>


                <label>

                    Age

                    <input
                        type="number"
                        name="age"
                        min="13"
                        max="100"
                        required
                    >

                </label>


                <label>

                    Weight (kg)

                    <input
                        type="number"
                        name="weight"
                        min="1"
                        max="500"
                        step="0.1"
                        required
                    >

                </label>


                <label>

                    Fitness Goal

                    <select
                        name="goal"
                        required
                    >

                        <option
                            value="general wellness"
                        >
                            General Wellness
                        </option>


                        <option
                            value="weight loss"
                        >
                            Weight Loss
                        </option>


                        <option
                            value="muscle gain"
                        >
                            Muscle Gain
                        </option>


                        <option
                            value="flexibility"
                        >
                            Flexibility
                        </option>


                        <option
                            value="endurance"
                        >
                            Endurance
                        </option>

                    </select>

                </label>


                <label>

                    Workout Intensity

                    <select
                        name="intensity"
                        required
                    >

                        <option
                            value="low"
                        >
                            Low
                        </option>


                        <option
                            value="medium"
                            selected
                        >
                            Medium
                        </option>


                        <option
                            value="high"
                        >
                            High
                        </option>

                    </select>

                </label>


            </div>


            <button
                type="submit"
            >

                Generate My Plan

            </button>


        </form>

    </section>


    <div class="note">

        FitBuddy provides general wellness
        information and is not a medical service.

    </div>


</main>


</body>

</html>
